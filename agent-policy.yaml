schema_version: 1
mode: planning-foundation
mutations:
  external_surfaces: forbidden
  registry: review-required
  schemas: review-required
  documentation: allowed
publication:
  sanitized_artifact_required: true
  receipt_required: true
automation:
  managed_region_required: true
  snapshot_before_apply: true
  verify_after_apply: true
  idempotency_required: true

fundus:
  canonical_contract: docs/fundus/asset-core-v1.md
  image_operations_contract: docs/fundus/image-operations-v1.md
  unresolved_aesthetic_direction:
    explore_before_fundus: true
    exploration_disposable_by_default: true
    no_fundus_ingest_or_registry_during_exploration: true
    visual_selection_required_for_promotion: true
    generated_exploration_retroactive_promotion_forbidden: true
    aesthetic_metrics_are_constraints_not_quality_scores: true
    rejected_direction_returns_to_exploration: true
  promotion_gate:
    promotion_is_not_acceptance: true
    prepared_brief_before_final_generated_or_edited_source: true
    final_source_master_must_be_new_after_brief_for_generated_exploration: true
  reusable_or_production_visuals:
    source_master_before_production: true
    generated_or_edited_requires_image_brief: true
    image_brief_digest_binding_required: true
    technical_acceptance_required: true
    visual_acceptance_required: true
    immutable_package_required: true
  source_modes:
    generated:
      image_brief_required: true
    edited:
      image_brief_required: true
    manual:
      image_brief_required: false
    unknown:
      image_brief_required: false
  cross_repo_integration:
    owner: grabowski
    schauwerk_direct_write: false

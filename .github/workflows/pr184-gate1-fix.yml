name: pr184-gate1-one-shot-fix

on:
  push:
    branches:
      - fix/native-diagram-gate1-terminal-20260912

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Verify exact starting revision
        run: |
          test "$(git rev-parse HEAD^)" = "8d4fb0551b5f8ff1babae204d999843a3deedd60"
          test "$(git rev-parse --abbrev-ref HEAD)" = "fix/native-diagram-gate1-terminal-20260912"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Prove both current-head regressions
        run: |
          python - <<'PY'
          import copy
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          from schauwerk.visual.native_diagram import render_native_diagram

          root_dir = Path.cwd()
          ns = "http://www.w3.org/2000/svg"

          def load(name: str) -> dict:
              return json.loads((root_dir / "docs/operators/fixtures/golden" / name).read_text())

          def parse(svg: str) -> ET.Element:
              return ET.fromstring(svg)

          def boxes(root: ET.Element) -> dict[str, tuple[float, float, float, float]]:
              result = {}
              for edge in root.iter():
                  if edge.attrib.get("data-source-kind") != "edge":
                      continue
                  rect = edge.find(f"{{{ns}}}rect")
                  assert rect is not None
                  result[edge.attrib["data-source-id"]] = tuple(
                      float(rect.attrib[key]) for key in ("x", "y", "width", "height")
                  )
              return result

          def overlap(a, b) -> bool:
              ax, ay, aw, ah = a
              bx, by, bw, bh = b
              return ax < bx + bw and ax + aw > bx and ay < by + bh and ay + ah > by

          label = (
              "Diese Verbindung beschreibt einen bewusst langen Prozessschritt "
              "zwischen weit entfernten Knoten im Diagramm"
          )
          process = load("decision-flow-v1.json")
          process["id"] = "pr184_outer_long_repro"
          process["title"] = "PR 184 outer long repro"
          process["purpose"] = "Reproduces independent process label allocators sharing the same outer area."
          process["intent"] = "process"
          process["groups"] = []
          process["nodes"] = [
              {
                  "id": f"n{index}",
                  "label": f"Node {index}",
                  "kind": "action",
                  "group": None,
                  "summary": "Regression node",
              }
              for index in range(20)
          ]
          process["edges"] = [
              {"id": "a0", "from": "n6", "to": "n13", "label": label, "kind": "flow"},
              {"id": "a1", "from": "n7", "to": "n12", "label": label, "kind": "flow"},
              {"id": "z0", "from": "n0", "to": "n19", "label": label, "kind": "flow"},
              {"id": "z1", "from": "n1", "to": "n18", "label": label, "kind": "flow"},
          ]
          process_boxes = boxes(parse(render_native_diagram(process)))
          process_overlap = any(
              overlap(process_boxes[outer], process_boxes[long])
              for outer in ("a0", "a1")
              for long in ("z0", "z1")
          )

          architecture = load("system-landscape-v1.json")
          architecture["id"] = "pr184_self_loop_canvas_repro"
          architecture["title"] = "PR 184 self loop canvas repro"
          architecture["purpose"] = "Reproduces a rightmost generic self-loop label leaving the SVG viewBox."
          architecture["intent"] = "architecture"
          architecture["groups"] = []
          architecture["nodes"] = [
              {
                  "id": f"n{index}",
                  "label": f"Node {index}",
                  "kind": "system",
                  "group": None,
                  "summary": "Regression node",
              }
              for index in range(4)
          ]
          architecture["edges"] = [
              {
                  "id": "loop",
                  "from": "n3",
                  "to": "n3",
                  "label": "Breite Beziehung zur rechten Diagrammkante mit mehreren Worten",
                  "kind": "flow",
              }
          ]
          architecture_root = parse(render_native_diagram(architecture))
          loop_box = boxes(architecture_root)["loop"]
          viewbox_width = float(architecture_root.attrib["viewBox"].split()[2])
          loop_overflow = loop_box[0] + loop_box[2] > viewbox_width

          print({"process_outer_long_overlap": process_overlap, "self_loop_overflow": loop_overflow})
          assert process_overlap, "expected current-head process outer/long label overlap did not reproduce"
          assert loop_overflow, "expected current-head generic self-loop overflow did not reproduce"
          PY
      - name: Capture accepted Golden SVG bytes before patch
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from schauwerk.visual.native_diagram import render_native_diagram

          root = Path.cwd() / "docs/operators/fixtures/golden"
          names = ("system-landscape-v1.json", "decision-flow-v1.json", "narrative-journey-v1.json")
          hashes = {}
          for name in names:
              model = json.loads((root / name).read_text())
              hashes[name] = hashlib.sha256(render_native_diagram(model).encode()).hexdigest()
          Path("/tmp/pr184-golden-before.json").write_text(json.dumps(hashes, sort_keys=True))
          print(hashes)
          PY
      - name: Apply minimal renderer fixes and regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/schauwerk/visual/native_diagram.py")
          source = source_path.read_text()

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one source match, got {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)

          replace_once(
              '''    node_width = _NARRATIVE_NODE_WIDTH if intent == "narrative" else _NODE_WIDTH\n    vertical_row_gap = process_row_gap if intent == "process" else non_process_row_gap\n''',
              '''    node_width = _NARRATIVE_NODE_WIDTH if intent == "narrative" else _NODE_WIDTH\n    if intent not in {"process", "narrative"}:\n        # Generic non-process self-loop labels are pushed fully to the right of\n        # their source card during rendering. Reserve that exact label bound in\n        # the viewBox up front so a loop on the rightmost card cannot be clipped.\n        required_self_loop_right = float(width)\n        for edge in model["edges"]:\n            if str(edge["kind"]) == "feedback" or edge["from"] != edge["to"]:\n                continue\n            metrics = _edge_label_metrics(edge, positions, intent)\n            source_x = positions[str(edge["from"])][0]\n            label_right = source_x + node_width + metrics.width + 8\n            required_self_loop_right = max(\n                required_self_loop_right,\n                label_right + 8,\n            )\n        width = max(width, math.ceil(required_self_loop_right))\n    vertical_row_gap = process_row_gap if intent == "process" else non_process_row_gap\n''',
          )

          replace_once(
              '''    process_adjacent_label_y: dict[str, float] = {}\n    occupied_process_adjacent_corridors: set[tuple[int, int]] = set()\n    if intent == "process":\n''',
              '''    process_adjacent_label_y: dict[str, float] = {}\n    occupied_process_adjacent_corridors: set[tuple[int, int]] = set()\n    process_outer_label_right = max(\n        (right for _, _, right, _ in packed_process_label_bounds),\n        default=0.0,\n    )\n    if intent == "process":\n''',
          )

          replace_once(
              '''                process_branch_gutter_x[edge_id] = cursor\n                label_right = cursor + 8 + _PROCESS_LABEL_MAX_WIDTH\n                required_right = max(required_right, label_right + _PAGE_MARGIN)\n                cursor = label_right + 12\n''',
              '''                process_branch_gutter_x[edge_id] = cursor\n                actual_label_right = (\n                    cursor\n                    + 8\n                    + _edge_label_metrics(edges_by_id[edge_id], positions, intent).width\n                )\n                process_outer_label_right = max(\n                    process_outer_label_right, actual_label_right\n                )\n                # Keep the established fixed-width lane reservation so existing\n                # process-gutter geometry does not move merely because this\n                # cross-packer occupancy bound became explicit.\n                label_right = cursor + 8 + _PROCESS_LABEL_MAX_WIDTH\n                required_right = max(required_right, label_right + _PAGE_MARGIN)\n                cursor = label_right + 12\n''',
          )

          replace_once(
              '''            width += max(0, required_gutter - _PROCESS_EDGE_GUTTER)\n            previous_bottom = 0.0\n''',
              '''            width += max(0, required_gutter - _PROCESS_EDGE_GUTTER)\n            if process_outer_label_right:\n                widest_long_branch_label = max(\n                    _edge_label_metrics(edge, positions, intent).width\n                    for _, _, edge in long_branches\n                )\n                # The long-branch packer runs after the adjacent/anchored outer\n                # lanes. Keep its whole label column to the right of the actual\n                # earlier label extent instead of assuming the historical 80 px\n                # edge gutter is still empty.\n                width = max(\n                    width,\n                    math.ceil(\n                        process_outer_label_right\n                        + 8\n                        + widest_long_branch_label / 2\n                        + required_gutter / 2\n                    ),\n                )\n            previous_bottom = 0.0\n''',
          )

          source_path.write_text(source)

          tests_path = Path("tests/visual/test_native_diagram.py")
          tests = tests_path.read_text()
          marker = "def test_process_long_branch_labels_clear_existing_outer_lanes()"
          if marker in tests:
              raise SystemExit("PR184 regression tests already present unexpectedly")
          tests += r'''


def test_process_long_branch_labels_clear_existing_outer_lanes() -> None:
    raw = _load("decision-flow-v1.json")
    raw["id"] = "pr184_outer_long_regression"
    raw["title"] = "Outer and long branch regression"
    raw["purpose"] = "Keep independently allocated process labels out of each other's lanes."
    raw["intent"] = "process"
    raw["groups"] = []
    raw["nodes"] = [
        {
            "id": f"n{index}",
            "label": f"Node {index}",
            "kind": "action",
            "group": None,
            "summary": "Regression node",
        }
        for index in range(20)
    ]
    label = (
        "Diese Verbindung beschreibt einen bewusst langen Prozessschritt "
        "zwischen weit entfernten Knoten im Diagramm"
    )
    raw["edges"] = [
        {"id": "a0", "from": "n6", "to": "n13", "label": label, "kind": "flow"},
        {"id": "a1", "from": "n7", "to": "n12", "label": label, "kind": "flow"},
        {"id": "z0", "from": "n0", "to": "n19", "label": label, "kind": "flow"},
        {"id": "z1", "from": "n1", "to": "n18", "label": label, "kind": "flow"},
    ]

    root = _parse(render_native_diagram(raw))
    boxes = _edge_label_boxes(root)
    for outer_id in ("a0", "a1"):
        for long_id in ("z0", "z1"):
            assert not _boxes_overlap(boxes[outer_id], boxes[long_id])

    reversed_raw = copy.deepcopy(raw)
    reversed_raw["edges"].reverse()
    reversed_root = _parse(render_native_diagram(reversed_raw))
    assert boxes == _edge_label_boxes(reversed_root)
    assert _edge_paths(root) == _edge_paths(reversed_root)


def test_generic_non_process_self_loop_label_stays_inside_canvas() -> None:
    raw = _load("system-landscape-v1.json")
    raw["id"] = "pr184_self_loop_canvas_regression"
    raw["title"] = "Generic self-loop canvas regression"
    raw["purpose"] = "Keep a rightmost non-process self-loop label inside the SVG viewBox."
    raw["intent"] = "architecture"
    raw["groups"] = []
    raw["nodes"] = [
        {
            "id": f"n{index}",
            "label": f"Node {index}",
            "kind": "system",
            "group": None,
            "summary": "Regression node",
        }
        for index in range(4)
    ]
    raw["edges"] = [
        {
            "id": "loop",
            "from": "n3",
            "to": "n3",
            "label": "Breite Beziehung zur rechten Diagrammkante mit mehreren Worten",
            "kind": "flow",
        }
    ]

    svg = render_native_diagram(raw)
    root = _parse(svg)
    label_box = _edge_label_boxes(root)["loop"]
    source_box = _node_boxes(root)["n3"]
    _, _, canvas_width, _ = (float(value) for value in root.attrib["viewBox"].split())
    x, _, width, _ = label_box

    assert x >= 0
    assert x + width <= canvas_width
    assert not _boxes_overlap(label_box, source_box)
    assert svg == render_native_diagram(copy.deepcopy(raw))
'''
          tests_path.write_text(tests)
          PY
      - name: Focused renderer regressions
        run: |
          python -m pytest -q tests/visual/test_native_diagram.py \
            -k 'process_long_branch_labels_clear_existing_outer_lanes or generic_non_process_self_loop_label_stays_inside_canvas'
      - name: Native renderer suite
        run: python -m pytest -q tests/visual/test_native_diagram.py
      - name: Canonical repository validation
        run: make validate
      - name: Prove Golden SVG bytes unchanged
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from schauwerk.visual.native_diagram import render_native_diagram

          root = Path.cwd() / "docs/operators/fixtures/golden"
          names = ("system-landscape-v1.json", "decision-flow-v1.json", "narrative-journey-v1.json")
          before = json.loads(Path("/tmp/pr184-golden-before.json").read_text())
          after = {}
          for name in names:
              model = json.loads((root / name).read_text())
              after[name] = hashlib.sha256(render_native_diagram(model).encode()).hexdigest()
          print({"before": before, "after": after})
          assert after == before
          PY
      - name: Commit verified fix and remove one-shot workflow
        run: |
          rm .github/workflows/pr184-gate1-fix.yml
          git diff --check
          git config user.name "grabowski-pr184-fix"
          git config user.email "actions@users.noreply.github.com"
          git add src/schauwerk/visual/native_diagram.py tests/visual/test_native_diagram.py .github/workflows/pr184-gate1-fix.yml
          git diff --cached --check
          git commit -m "fix(visual): close remaining Gate 1 label gaps"
          git push origin HEAD:fix/native-diagram-gate1-terminal-20260912
